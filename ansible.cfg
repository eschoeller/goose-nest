[defaults]
inventory = ./inventory/localhost.yml
roles_path = ./roles
host_key_checking = False
stdout_callback = ansible.builtin.default
result_format = yaml
interpreter_python = /usr/bin/python3.13

[privilege_escalation]
# Ubuntu now ships sudo-rs as the default /usr/bin/sudo alternative, and its
# prompt flow confuses Ansible's become plugin (hangs on "Timed out waiting
# for become success or become password prompt" even with -K). Point Ansible
# at the classic sudo binary, which is still installed alongside sudo-rs.
become_exe = /usr/bin/sudo.ws
